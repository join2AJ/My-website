<!-- @dsCard group="Colors" viewport="700x150" name="Ink & cloud neutrals" subtitle="Terminal-interior surfaces and instrument text" -->
<!DOCTYPE html><html><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--surface-card); font-family:var(--font-sans); }
  .wrap { display:flex; padding:20px; }
  .sw { flex:1; height:92px; display:flex; flex-direction:column; justify-content:flex-end; padding:8px 10px; border:1px solid var(--cloud-200); border-left:none; }
  .sw:first-child{border-left:1px solid var(--cloud-200);border-radius:var(--radius-sm) 0 0 var(--radius-sm);} .sw:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0;}
  .n { font-family:var(--font-mono); font-size:10px; font-weight:600; }
  .h { font-family:var(--font-mono); font-size:10px; opacity:.7; }
</style></head><body>
<div class="wrap">
  <div class="sw" style="background:var(--ink-900);color:#fff"><span class="n">ink-900</span><span class="h">#0A1124</span></div>
  <div class="sw" style="background:var(--ink-700);color:#fff"><span class="n">ink-700</span><span class="h">#1E2A44</span></div>
  <div class="sw" style="background:var(--ink-500);color:#fff"><span class="n">ink-500</span><span class="h">#475068</span></div>
  <div class="sw" style="background:var(--ink-300);color:#0A1124"><span class="n">ink-300</span><span class="h">#9AA3B7</span></div>
  <div class="sw" style="background:var(--cloud-200);color:#0A1124"><span class="n">cloud-200</span><span class="h">#E3EAF6</span></div>
  <div class="sw" style="background:var(--cloud-100);color:#0A1124"><span class="n">cloud-100</span><span class="h">#F5F8FF</span></div>
  <div class="sw" style="background:var(--white);color:#0A1124"><span class="n">white</span><span class="h">#FFFFFF</span></div>
</div>
</body></html>
