<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Low, navy-tinted shadows — instrument-panel lift" -->
<!DOCTYPE html><html><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--surface-app); font-family:var(--font-sans); padding:26px 24px; }
  .row { display:flex; gap:24px; }
  .item { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .box { width:120px; height:64px; background:var(--surface-card); border:1px solid var(--cloud-200); border-radius:var(--radius-md); }
  .n { font-family:var(--font-mono); font-size:11px; color:var(--ink-400); }
</style></head><body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="n">xs</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="n">sm — card rest</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="n">md — hover</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="n">lg — dialog</span></div>
  </div>
</body></html>
