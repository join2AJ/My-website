<!-- @dsCard group="Colors" viewport="700x190" name="Regulator liveries" subtitle="Each authority owns one fixed hue — like airline liveries" -->
<!DOCTYPE html><html><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--surface-card); font-family:var(--font-sans); }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:20px; }
  .item { display:flex; flex-direction:column; gap:8px; }
  .bar { height:40px; border-radius:var(--radius-sm); display:flex; align-items:center; padding:0 12px; color:#fff; font-family:var(--font-mono); font-weight:600; font-size:13px; letter-spacing:.04em; }
  .hx { font-family:var(--font-mono); font-size:10px; color:var(--ink-400); }
</style></head><body>
<div class="grid">
  <div class="item"><div class="bar" style="background:var(--reg-bcas)">BCAS</div><span class="hx">#DC2626 · Security</span></div>
  <div class="item"><div class="bar" style="background:var(--reg-dgca)">DGCA</div><span class="hx">#1A56DB · Aviation</span></div>
  <div class="item"><div class="bar" style="background:var(--reg-aai)">AAI</div><span class="hx">#0891B2 · Infra</span></div>
  <div class="item"><div class="bar" style="background:var(--reg-aera)">AERA</div><span class="hx">#7C3AED · Economic</span></div>
  <div class="item"><div class="bar" style="background:var(--reg-moef)">MoEF</div><span class="hx">#0E9F6E · Environment</span></div>
  <div class="item"><div class="bar" style="background:var(--reg-epfo)">EPFO</div><span class="hx">#D97706 · Labour</span></div>
  <div class="item"><div class="bar" style="background:var(--reg-certin)">CERT-In</div><span class="hx">#5B21B6 · Cyber</span></div>
</div>
</body></html>
