<!-- @dsCard group="Type" viewport="700x180" name="Display — Instrument Serif" subtitle="Authoritative headings, like instrument labels" -->
<!DOCTYPE html><html><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--surface-card); font-family:var(--font-sans); padding:22px 24px; }
  .d1 { font:var(--type-display); color:var(--text-strong); margin:0 0 4px; }
  .d2 { font:var(--type-h2); color:var(--text-body); margin:0 0 14px; }
  .meta { font-family:var(--font-mono); font-size:11px; color:var(--ink-400); letter-spacing:.02em; }
</style></head><body>
  <div class="d1">Every obligation, cleared for landing</div>
  <div class="d2">21 departments · 7 regulators</div>
  <div class="meta">Instrument Serif · 400 · display 48 / h1 38 / h2 30 · tracking −0.02em</div>
</body></html>
