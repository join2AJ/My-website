<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid — instrument-panel rhythm" -->
<!DOCTYPE html><html><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--surface-card); font-family:var(--font-sans); padding:24px; }
  .row { display:flex; align-items:flex-end; gap:14px; }
  .item { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .bar { background:var(--navy-500); border-radius:2px; width:24px; }
  .n { font-family:var(--font-mono); font-size:10px; color:var(--ink-400); }
</style></head><body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px"></div><span class="n">2</span></div>
    <div class="item"><div class="bar" style="height:8px"></div><span class="n">4</span></div>
    <div class="item"><div class="bar" style="height:12px"></div><span class="n">8</span></div>
    <div class="item"><div class="bar" style="height:16px"></div><span class="n">12</span></div>
    <div class="item"><div class="bar" style="height:24px"></div><span class="n">16</span></div>
    <div class="item"><div class="bar" style="height:32px"></div><span class="n">24</span></div>
    <div class="item"><div class="bar" style="height:48px"></div><span class="n">32</span></div>
    <div class="item"><div class="bar" style="height:64px"></div><span class="n">48</span></div>
    <div class="item"><div class="bar" style="height:80px"></div><span class="n">64</span></div>
  </div>
</body></html>
