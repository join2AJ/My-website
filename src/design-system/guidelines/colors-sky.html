<!-- @dsCard group="Colors" viewport="700x150" name="Sky / Navy ramp" subtitle="Dawn → cruise — the primary brand ramp" -->
<!DOCTYPE html><html><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--surface-card); font-family:var(--font-sans); }
  .wrap { display:flex; padding:20px; gap:0; }
  .sw { flex:1; height:96px; border-radius:0; display:flex; flex-direction:column; justify-content:flex-end; padding:8px 10px; }
  .sw:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm);} .sw:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0;}
  .n { font-family:var(--font-mono); font-size:10px; font-weight:600; }
  .h { font-family:var(--font-mono); font-size:10px; opacity:.8; }
</style></head><body>
<div class="wrap">
  <div class="sw" style="background:var(--navy-900);color:#fff"><span class="n">navy-900</span><span class="h">#050F22</span></div>
  <div class="sw" style="background:var(--navy-800);color:#fff"><span class="n">navy-800</span><span class="h">#071830</span></div>
  <div class="sw" style="background:var(--navy-600);color:#fff"><span class="n">navy-600</span><span class="h">#0D2B6E</span></div>
  <div class="sw" style="background:var(--navy-500);color:#fff"><span class="n">navy-500</span><span class="h">#1249C0</span></div>
  <div class="sw" style="background:var(--blue-400);color:#fff"><span class="n">blue-400</span><span class="h">#3B82F6</span></div>
  <div class="sw" style="background:var(--blue-200);color:#0A1124"><span class="n">blue-200</span><span class="h">#93C5FD</span></div>
  <div class="sw" style="background:var(--blue-100);color:#0A1124"><span class="n">blue-100</span><span class="h">#DBE7FF</span></div>
</div>
</body></html>
