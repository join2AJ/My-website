<!-- @dsCard group="Components" viewport="700x340" name="Form Controls" subtitle="Input, select, switch, checkbox, radio" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--surface-app); font-family: var(--font-sans); }
  #root { padding: 22px 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  .switches { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
  .pickrow { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
  .lbl { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-300); margin-bottom: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Input, Select, Switch, Checkbox, Radio } = window.CompliantBharatAviationDesignSystem_77e7f4;
  function Demo() {
    return (
      <div>
        <div className="grid">
          <Input label="Obligation ID" mono placeholder="BCAS-AEP-00" />
          <Select label="Regulator" options={['BCAS','DGCA','AAI','AERA','MoEF','EPFO','CERT-In']} />
          <Input label="Airport" placeholder="Search airports…" />
          <Input label="Filing date" error="Date is in the past" defaultValue="12 Mar 2026" />
        </div>
        <div className="switches">
          <Switch label="Auto-ingest CERT-In advisories" defaultChecked />
          <Switch label="Notify department heads on breach" />
          <Switch label="Locked policy (read-only)" disabled defaultChecked />
        </div>
        <div className="pickrow">
          <div>
            <div className="lbl">Checkbox</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <Checkbox label="Include contractor staff" defaultChecked />
              <Checkbox label="Exclude filed obligations" />
            </div>
          </div>
          <div>
            <div className="lbl">Radio — report cadence</div>
            <Radio defaultValue="Quarterly" options={['Monthly','Quarterly','Annually']} />
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
